# Application
spring.application.name=EmailManagementNew
server.port=8080

# Spring Cloud Config
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# MVC & Error Handling
spring.mvc.favicon.enabled=false
server.error.whitelabel.enabled=false
server.error.include-message=always

# Logging
logging.level.org.springframework.security=DEBUG

# Datasource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5433/mails
spring.datasource.username=postgres
spring.datasource.password=2325
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=firetesingop@gmail.com
spring.mail.password=mwaiiyntematvrwe
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Admin Alert Email
admin.email=firetesingop@gmail.com

# File upload settings
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

